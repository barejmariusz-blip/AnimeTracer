name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ui/**'
      - 'seed.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk AnimeTracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeTracker-APK
          path: AnimeTracker.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Anime Tracker Android v${{ github.run_number }}
          files: AnimeTracker.apk
